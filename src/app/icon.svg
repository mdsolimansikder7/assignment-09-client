<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="GearLoop logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="gl-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Gear teeth -->
  <g fill="url(#gl-orange)">
    <rect x="44" y="5" width="12" height="17" rx="3.5"/>
    <rect x="44" y="5" width="12" height="17" rx="3.5" transform="rotate(45 50 50)"/>
    <rect x="44" y="5" width="12" height="17" rx="3.5" transform="rotate(90 50 50)"/>
    <rect x="44" y="5" width="12" height="17" rx="3.5" transform="rotate(135 50 50)"/>
    <rect x="44" y="5" width="12" height="17" rx="3.5" transform="rotate(180 50 50)"/>
    <rect x="44" y="5" width="12" height="17" rx="3.5" transform="rotate(225 50 50)"/>
    <rect x="44" y="5" width="12" height="17" rx="3.5" transform="rotate(270 50 50)"/>
    <rect x="44" y="5" width="12" height="17" rx="3.5" transform="rotate(315 50 50)"/>
    <!-- Gear body -->
    <circle cx="50" cy="50" r="33"/>
  </g>

  <!-- Inner circle -->
  <circle cx="50" cy="50" r="21" fill="#0F172A"/>

  <!-- Loop arrow -->
  <path d="M57.5 39.5 A12 12 0 1 1 42.5 39.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <polygon points="48.5,35.5 42,43 36.5,36" fill="#FFFFFF" transform="translate(2.5 -0.5)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
